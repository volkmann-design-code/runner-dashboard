name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # GitHub-hosted on purpose: a public repo's PRs must not run on self-hosted runners
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:server
      - run: npm test
      - run: npm run build
      - name: Build image
        run: docker build -t runner-dashboard:ci .
